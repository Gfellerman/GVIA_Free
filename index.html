<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Selector Agent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Fleet Selector Agent</h1>
    </header>
    <main>
        <div class="filters">
            <h2>Filters</h2>
            <form id="filter-form">
                <div class="form-group">
                    <label for="country">Country:</label>
                    <select id="country" name="country" required>
                        <option value="" disabled selected>Please select a country</option>
                        <option value="us">United States</option>
                        <option value="ca">Canada</option>
                        <option value="de">Germany</option>
                        <option value="jp">Japan</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Type of Transport:</label>
                    <div><input type="checkbox" id="transport-goods" name="transport-type" value="goods"><label for="transport-goods">Goods</label></div>
                    <div><input type="checkbox" id="transport-person" name="transport-type" value="person"><label for="transport-person">Person</label></div>
                </div>
                <div id="goods-specific-filters" style="display: none;">
                    <div class="form-group">
                        <label for="tonnage-capacity">Tonnage Capacity (in tons):</label>
                        <input type="number" id="tonnage-capacity" name="tonnage-capacity">
                    </div>
                    <div class="form-group">
                        <label for="cubic-meter-capacity">Cubic Meter Capacity (m³):</label>
                        <input type="number" id="cubic-meter-capacity" name="cubic-meter-capacity">
                    </div>
                    <div class="form-group">
                        <label for="towing-capacity">Towing Capacity (in kg):</label>
                        <input type="number" id="towing-capacity" name="towing-capacity">
                    </div>
                </div>
                <div class="form-group">
                    <label>Trip Range:</label>
                    <div><input type="checkbox" id="trip-long" name="trip-range" value="long"><label for="trip-long">Long Trips</label></div>
                    <div><input type="checkbox" id="trip-short" name="trip-range" value="short"><label for="trip-short">Short Trips</label></div>
                </div>
                <div class="form-group">
                    <label>Vehicle Class:</label>
                    <div><input type="checkbox" id="class-basic" name="vehicle-class" value="basic"><label for="class-basic">Basic</label></div>
                    <div><input type="checkbox" id="class-medium" name="vehicle-class" value="medium"><label for="class-medium">Medium</label></div>
                    <div><input type="checkbox" id="class-luxury" name="vehicle-class" value="luxury"><label for="class-luxury">Luxury</label></div>
                </div>
                <div class="form-group">
                    <label id="max-mileage-label" for="max-mileage">Max Mileage:</label>
                    <input type="number" id="max-mileage" name="max-mileage">
                </div>
                <div class="form-group">
                    <label for="max-years">Max Years of Use:</label>
                    <input type="number" id="max-years" name="max-years">
                </div>
                <div class="form-group">
                    <label id="avg-mileage-label" for="avg-mileage">Average Mileage per Year:</label>
                    <input type="number" id="avg-mileage" name="avg-mileage">
                </div>
                <div class="form-group">
                    <label>Vehicle Orientation:</label>
                    <div><input type="checkbox" id="orientation-powerful" name="vehicle-orientation" value="powerful"><label for="orientation-powerful">Powerful</label></div>
                    <div><input type="checkbox" id="orientation-economic" name="vehicle-orientation" value="economic"><label for="orientation-economic">Economic</label></div>
                </div>
                <div class="form-group">
                    <label>Color Preference:</label>
                    <div><input type="checkbox" id="color-bright" name="color-preference" value="bright"><label for="color-bright">Bright</label></div>
                    <div><input type="checkbox" id="color-dark" name="color-preference" value="dark"><label for="color-dark">Dark</label></div>
                </div>
                <div class="form-group">
                    <label>Vehicle Origin:</label>
                    <div><input type="checkbox" id="origin-na" name="origin" value="na"><label for="origin-na">North America</label></div>
                    <div><input type="checkbox" id="origin-eu" name="origin" value="eu"><label for="origin-eu">Europe</label></div>
                    <div><input type="checkbox" id="origin-jp" name="origin" value="jp"><label for="origin-jp">Japan</label></div>
                    <div><input type="checkbox" id="origin-kr" name="origin" value="kr"><label for="origin-kr">Korea</label></div>
                    <div><input type="checkbox" id="origin-cn" name="origin" value="cn"><label for="origin-cn">China</label></div>
                    <div><input type="checkbox" id="origin-other" name="origin" value="other"><label for="origin-other">Other</label></div>
                </div>
                <div class="form-group">
                    <label>Powertrain:</label>
                    <div><input type="checkbox" id="powertrain-all" name="powertrain-all"><label for="powertrain-all">Select All</label></div>
                    <div><input type="checkbox" id="powertrain-petrol" name="powertrain" value="petrol"><label for="powertrain-petrol">Petrol</label></div>
                    <div><input type="checkbox" id="powertrain-diesel" name="powertrain" value="diesel"><label for="powertrain-diesel">Diesel</label></div>
                    <div><input type="checkbox" id="powertrain-hybrid" name="powertrain" value="hybrid"><label for="powertrain-hybrid">Hybrid</label></div>
                    <div><input type="checkbox" id="powertrain-electric" name="powertrain" value="electric"><label for="powertrain-electric">Electric</label></div>
                </div>
                <div class="form-group">
                    <label>Car Body Types:</label>
                    <div><input type="checkbox" id="body-sedan" name="body" value="sedan"><label for="body-sedan">Sedan</label></div>
                    <div><input type="checkbox" id="body-hatchback" name="body" value="hatchback"><label for="body-hatchback">Hatchback</label></div>
                    <div><input type="checkbox" id="body-wagon" name="body" value="wagon"><label for="body-wagon">Wagon</label></div>
                    <div><input type="checkbox" id="body-3door" name="body" value="3door"><label for="body-3door">3 doors</label></div>
                    <div><input type="checkbox" id="body-5door" name="body" value="5door"><label for="body-5door">5 doors</label></div>
                </div>
                <button type="submit">Search</button>
            </form>
        </div>
        <div class="results">
            <h2>Results</h2>
            <div id="results-container">
                <!-- Results will be displayed here -->
            </div>
            <button id="more-results">More</button>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Fleet Selector Agent</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
